name: Build QMK firmware

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    name: 'Build'
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master

  publish:
    name: Publish
    if: github.ref == 'refs/heads/main' && !cancelled()
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-tags: true

      - name: Get next version
        uses: reecetech/version-increment@2026.8.4
        id: version
        with:
          scheme: semver
          increment: patch

      - name: Download binaries
        if: always() && !cancelled()
        uses: actions/download-artifact@v8
        with:
          name: Firmware

      - name: Install rename
        run: sudo apt install rename

      - name: Rename binaries to include version
        run: "find . \\( -name '*.bin' -o -name '*.hex' -o -name '*.uf2' \\) -exec rename 's/(.*)\\.([^.]*)/$1.v${{ steps.version.outputs.version }}.$2/' {} \\;"

      - name: Generate Release
        uses: softprops/action-gh-release@v3
        if: always() && !cancelled()
        with:
          token: ${{ github.token }}
          name: v${{ steps.version.outputs.version }}
          tag_name: v${{ steps.version.outputs.version }}
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          files: |
            **/*.bin
            **/*.hex
            **/*.uf2
